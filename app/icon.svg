<svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <rect width="32" height="32" rx="7" fill="#08080C"/>

  <!-- captured top-left box (player one) -->
  <rect x="7" y="7" width="9" height="9" fill="#C8FF00" fill-opacity="0.18"/>
  <path d="M7 7 L16 7 M16 7 L16 16 M16 16 L7 16 M7 16 L7 7"
        stroke="#C8FF00" stroke-width="1.4" stroke-linecap="round"/>

  <!-- a partial line begun by player two (bottom-right) -->
  <line x1="16" y1="25" x2="25" y2="25"
        stroke="#FF4D6D" stroke-width="1.4" stroke-linecap="round"/>

  <!-- 3×3 dot lattice -->
  <g fill="#F5F1E8">
    <circle cx="7"  cy="7"  r="1.5"/>
    <circle cx="16" cy="7"  r="1.5"/>
    <circle cx="25" cy="7"  r="1.5"/>
    <circle cx="7"  cy="16" r="1.5"/>
    <circle cx="16" cy="16" r="1.5"/>
    <circle cx="25" cy="16" r="1.5"/>
    <circle cx="7"  cy="25" r="1.5"/>
    <circle cx="16" cy="25" r="1.5"/>
    <circle cx="25" cy="25" r="1.5"/>
  </g>
</svg>
